name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        elif [ -f "app/gradlew" ]; then
          chmod +x app/gradlew
        else
          echo "gradlew not found"
        fi

    - name: Build with Gradle
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "app/gradlew" ]; then
          cd app && ./gradlew assembleDebug
        else
          echo "No gradlew found to build"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hud-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
