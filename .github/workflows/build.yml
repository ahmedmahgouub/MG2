name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 # تحديث لنسخة v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4 # تحديث لنسخة v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4 # 🟢 التحديث الجذري للإصدار v4 المعتمد حالياً لمنع حظر السيرفر
      with:
        name: hud-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
